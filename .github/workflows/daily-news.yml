name: Daily News Auto

on:
  schedule:
    # 폴백 발행 시도 창 — KST 21:51 / 22:31 / 23:11 (UTC 12:51~14:11).
    # 프라이머리(클로드 루틴)가 20:47 KST에 돌아 ~21:10에 발행하므로 그 뒤에 둔다.
    # 루틴 시각을 20:47로 옮긴 이유: 17:07에 돌던 시절 5시간 세션 한도(리셋 20:00 KST)에
    # 매번 걸려 죽었다(2026-08-31 로그: rate_limit rejected five_hour). 한도 리셋 직후로 이동.
    # 여러 번 거는 이유: GitHub Actions 스케줄은 러너 혼잡 시 몇 시간씩 밀린다
    # (2026-09-01: UTC 09:33 예약이 UTC 17:13에 실행 → KST 02:13 새벽 발행 사고).
    # 한 타임이 밀려도 다른 타임이 제때 뜨면 그날 발행이 살아난다. 먼저 성공한
    # 실행이 커밋을 남기면 아래 가드가 나머지를 전부 스킵시키므로 중복은 안 난다.
    - cron: '51 12 * * *'
    - cron: '31 13 * * *'
    - cron: '11 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if already published today
        id: guard
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          NOW=$((10#$(TZ=Asia/Seoul date +%H%M)))
          # 0) 지각 실행 컷오프 — 예약이 밀려 발행 시간대를 벗어났으면 아예 발행하지 않는다.
          #    Actions 스케줄 지연이 7~8시간까지 벌어지면서 새벽 2~6시에 디스코드
          #    알림이 나가는 사고가 반복됐다(2026-08-29 05:58, 2026-09-01 02:13 KST).
          #    늦게라도 보내는 것보다 그날 거르는 편이 낫다는 판단. 허용 창 = KST 16:00~23:30.
          #    수동 실행(workflow_dispatch)은 사람이 의도한 것이므로 컷오프를 적용하지 않는다.
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$NOW" -lt 2130 ] || [ "$NOW" -gt 2345 ]; }; then
            echo "현재 KST $(TZ=Asia/Seoul date +%H:%M) — 발행 허용 창(21:30~23:45) 밖. 스케줄 지연으로 판단해 발행 생략"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 1) main에 오늘자 큐레이션(_auto 아님)이 이미 있으면 스킵.
          if ls output/news/${TODAY}_*.json 2>/dev/null | grep -v _auto > /dev/null; then
            echo "오늘자(${TODAY}) 발행물이 main에 이미 존재 — 폴백 발송 생략"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 2) 12:00 클로드 스케줄이 임시 브랜치(claude/*)에 오늘자 큐레이션을 올렸으면 스킵.
          #    (스케줄 결과는 claude/* 브랜치로 푸시되고 discord-notify가 이미 전송함 → 중복 방지)
          git fetch --quiet --prune origin '+refs/heads/claude/*:refs/remotes/origin/claude/*' || true
          for b in $(git for-each-ref --format='%(refname)' refs/remotes/origin/claude/ 2>/dev/null); do
            if git ls-tree -r --name-only "$b" -- output/news 2>/dev/null \
                 | grep -E "/${TODAY}_" | grep -v _auto > /dev/null; then
              echo "오늘자(${TODAY}) 큐레이션이 ${b} 에 존재 — 클로드 스케줄이 이미 발행, 폴백 생략"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # 3) 폴백 자신이 오늘자를 이미 발행했으면 스킵.
          #    GitHub Actions 스케줄 지연이 몇 시간~10시간대로 커지면서, 어제 몫 폴백이
          #    늦게 실행돼 오늘 날짜(KST)로 발행한 뒤 오늘 몫 폴백이 또 실행되며 같은
          #    _auto_*.json을 새 내용으로 덮어써 하루 두 번 Discord 알림이 나가는 사고가
          #    있었다(2026-08-29: 05:58 KST 1차 + 23:40 KST 2차 중복 발행).
          #    위 1)·2)는 "정규가 발행했는가"만 보고 "폴백 자신이 이미 발행했는가"는
          #    안 봤으므로 별도로 확인한다.
          if ls output/news/${TODAY}_auto_*.json 2>/dev/null > /dev/null; then
            echo "오늘자(${TODAY}) 폴백 발행물이 main에 이미 존재 — 재발행 생략"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "오늘자 발행물 없음 — 폴백 진행"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.2.2 Pillow==10.4.0 "curl_cffi>=0.7"

      - name: Run daily auto selector & Discord send
        if: steps.guard.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not set"
            exit 1
          fi
          python tools/daily_auto.py

      - name: Commit auto JSON (deduplication 기록용)
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # _auto*.json 파일만 커밋 (PNG 제외 — discord-notify 중복 트리거 방지)
          git add output/news/*_auto*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
          else
            # commit을 먼저 해야 pull --rebase가 동작 (staged 상태에서 rebase 불가)
            # 러너 기본 타임존은 UTC라 date 명령 결과를 그대로 "KST"라 찍으면 실제
            # 시각과 어긋난다(디버깅 시 혼란의 원인이었음) — TZ 지정으로 실제 KST를 찍는다.
            git commit -m "auto: $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M) KST 뉴스 자동 발행 기록"
            git pull --rebase origin main
            git push origin main || (sleep 5 && git pull --rebase origin main && git push origin main)
          fi
